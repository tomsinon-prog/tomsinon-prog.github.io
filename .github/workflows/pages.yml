# Put this file in the repo tomsinon-prog.github.io as .github/workflows/pages.yml (Add file -> Create new file).
# It publishes TuneLab-site.zip (uploaded to the repo root) as the website, every time a new zip is uploaded.
# Settings -> Pages -> Source must be "GitHub Actions".
name: Publish TuneLab site
on:
  push:
    paths: ['TuneLab-site.zip', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the site (keeps .well-known for the app links)
        run: |
          mkdir site
          unzip -q TuneLab-site.zip -d site
          tar --dereference --hard-dereference --directory site -cvf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - id: deployment
        uses: actions/deploy-pages@v4
